services:
  - type: web
    name: funnel-master
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 60
    healthCheckPath: /api/health
    envVars:
      - key: FUNNEL_ENV
        value: production
      - key: FUNNEL_HTTPS
        value: "1"
      - key: FUNNEL_SECRET_KEY
        generateValue: true
      - key: FUNNEL_DB_PATH
        value: /var/data/funnel_master.sqlite3
    disk:
      name: funnel-master-data
      mountPath: /var/data
      sizeGB: 1
